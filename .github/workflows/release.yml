name: Release

# Un tag `vX.Y.Z` poussé depuis n'importe quelle machine suffit : GitHub prête
# les runners macOS, ce qui évite d'avoir à ressortir le Mac à chaque version.
# Les binaires Apple ne peuvent pas se construire ailleurs que sur macOS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Les notes de version se calculent à partir du tag précédent : sans
          # l'historique complet, il n'y a rien à comparer.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Compiler Tauri from scratch prend ~10 min ; le cache ramène ça à ~2 min
      # sur les versions suivantes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Le changelog du site lit le corps des releases. Un texte générique
      # identique d'une version à l'autre n'apprendrait rien : on le compose à
      # partir des messages de commit depuis le tag précédent.
      - name: Compose les notes de version
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            lignes=$(git log --no-merges --format='- %s' "$prev..${{ github.ref_name }}")
          else
            lignes=$(git log --no-merges --format='- %s' -n 8)
          fi
          {
            echo 'body<<POLYGLOT_EOF'
            echo "$lignes"
            echo
            echo "**Installation** : télécharger l'installeur de la plateforme. Les versions déjà installées se mettent à jour toutes seules."
            echo 'POLYGLOT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sans cette clé les artefacts ne sont pas signés, et l'updater les
          # refuse. Elle se règle une fois : gh secret set TAURI_SIGNING_PRIVATE_KEY
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # La cle est protegee par mot de passe exactement pour cette raison :
          # une chaine vide ne survit pas a un environnement Windows, et sans
          # variable Tauri pose la question sur l'entree standard puis se bloque.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Polyglot ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Publiée en brouillon : les trois jobs déposent leurs artefacts dans
          # la même release, on ne la rend visible qu'une fois tous arrivés.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
